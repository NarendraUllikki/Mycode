        body {
    font-family: Arial, sans-serif;
    background-color: #057dfdb3;
    margin: 0;
    padding: 0;
}
.lecturer-photo {
            border-radius: 50%;
            height: 150px;
            margin: 0 auto 20px;
            overflow: hidden;
            width: 150px;
    
 }
#main{
    max-width: 800px;
    margin: 50px auto;
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0px 0px 30px rgb(0, 0, 0);
    border:3px solid rgb(255, 255, 255);
    transition: all 0.3s ease-in-out;
    overflow: hidden;
}
h3 {
    color: #007bff;
}
label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #666;
}

#main .lecturer-info div{
    width: 95%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
}

.gb-btn {
    background-color: #007bff;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    overflow: hidden;
}
#gbbtn
{
    display: flex;
    justify-content: center;
    margin-top:23px;
}
.gb-btn:hover {
    background-color: #0056b3;
}
